name: Keep-warm

# Mantém os serviços do Render acordados.
#
# No plano Free o Render "dorme" após ~15 minutos sem tráfego; a primeira
# requisição seguinte paga o cold start (~25 s). Isso atrapalha o webhook do
# Mercado Pago, que precisa de resposta rápida.
#
# Este workflow faz um ping leve no /health a cada 10 minutos.
#
# IMPORTANTE — por que este workflow NAO tem agendamento:
#
#   Em repositorio PRIVADO, cada execucao consome minutos faturaveis do
#   Actions (arredondado para cima = 1 min por execucao). Um cron de 10 em
#   10 minutos daria ~144 execucoes/dia (~4.320 min/mes), acima da cota
#   gratuita de 2.000 min/mes — sairia mais caro que o plano Starter do
#   Render.
#
#   Para o keep-warm periodico use o UptimeRobot (gratuito e externo). Este
#   workflow fica para execucao MANUAL: util para acordar os servicos antes
#   de um teste ou de uma demonstracao.
#
#   Se o repositorio for publico, o Actions e gratuito e o agendamento pode
#   ser reativado descomentando o bloco "schedule" abaixo.

on:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest

    steps:
      - name: Nebula Core
        run: |
          code=$(curl -sS --max-time 90 -o /dev/null -w '%{http_code}' \
            https://nebula-core-6hq4.onrender.com/health)
          echo "core: HTTP $code"
          test "$code" = "200"

      - name: Nebula Admin (BFF)
        run: |
          code=$(curl -sS --max-time 90 -o /dev/null -w '%{http_code}' \
            https://nebula-admin-ciri.onrender.com/health)
          echo "bff: HTTP $code"
          test "$code" = "200"
