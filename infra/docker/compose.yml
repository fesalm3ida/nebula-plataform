name: nebula-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: nebula-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256

    secrets:
      - postgres_password

    ports:
      - "${POSTGRES_PORT:-5434}:5432"

    volumes:
      - nebula_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - nebula_network

secrets:
  postgres_password:
    file: ../../backend/nebula-core/.secrets/postgres_password

volumes:
  nebula_postgres_data:
    name: nebula_postgres_data

networks:
  nebula_network:
    name: nebula_network
    driver: bridge
