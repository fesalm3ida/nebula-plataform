[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "nebula-core"
version = "0.3.0.dev0"
description = "Core backend and domain services for the Nebula Platform."
readme = "README.md"
requires-python = ">=3.10,<4.0"

authors = [
    { name = "Nebula Software House" }
]

dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.139,<1.0",
    # Usado em runtime pelo cliente do Mercado Pago (payments).
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.14,<3.0",
    "PyJWT>=2.10,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.51,<1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
]
