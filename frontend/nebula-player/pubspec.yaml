name: nebula_player
description: Nebula Player (Flutter) - cliente Android do Nebula Platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # Player de video (libmpv) para IPTV (mpegts/HLS).
  media_kit: ^1.0.0
  media_kit_video: ^1.0.0
  media_kit_libs_video: ^1.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
